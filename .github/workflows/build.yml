name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK de debug
        run: sh gradlew --no-daemon --stacktrace assembleDebug
      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: casa-e-patas-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK numa Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk casa-e-patas.apk
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest casa-e-patas.apk \
            --title "Casa e Patas (APK)" \
            --notes "APK de debug gerado automaticamente." \
            --prerelease
