name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK + testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes unitários e APK de debug
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: casa-e-patas-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Guardar relatórios dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-unitarios
          path: app/build/reports/tests/
          if-no-files-found: ignore

  notifications:
    name: Testar notificações num emulador Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Ativar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Correr testes no emulador (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest
      - name: Guardar relatórios dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-notificacoes
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
